version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    # Keep TypeScript within typescript-eslint's supported peer range.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=6.1.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
