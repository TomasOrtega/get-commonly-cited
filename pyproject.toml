[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commonly-cited"
version = "0.1.0"
description = "Find the people cited most often in a noisy reference list, including authors hidden behind et al."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Tomas Ortega" },
]
keywords = [
  "bibliography",
  "citations",
  "crossref",
  "openalex",
  "research software",
  "scholarly metadata",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
  "rapidfuzz>=3.9",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/TomasOrtega/get-commonly-cited"
Documentation = "https://github.com/TomasOrtega/get-commonly-cited/tree/main/docs"
Repository = "https://github.com/TomasOrtega/get-commonly-cited"
Issues = "https://github.com/TomasOrtega/get-commonly-cited/issues"
Changelog = "https://github.com/TomasOrtega/get-commonly-cited/blob/main/CHANGELOG.md"

[project.scripts]
commonly-cited = "commonly_cited.cli:main"
get-commonly-cited = "commonly_cited.cli:main"

[dependency-groups]
test = [
  "pytest>=9",
  "pytest-cov>=7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "build>=1.2",
  "mypy>=1.15",
  "nox>=2025.2.9",
  "prek>=0.2",
  "ruff>=0.16.2",
  "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/commonly_cited"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
  "-ra",
  "--showlocals",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
parallel = true
source = ["commonly_cited"]

[tool.coverage.paths]
source = [
  "src/commonly_cited",
  "*/site-packages/commonly_cited",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]

[tool.ruff]
target-version = "py310"
line-length = 100
show-fixes = true
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PTH",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "TC",
  "UP",
  "W",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["commonly_cited"]

[tool.ruff.format]
docstring-code-format = true

[tool.codespell]
skip = "*.lock,*.json"
ignore-words-list = "crate"
